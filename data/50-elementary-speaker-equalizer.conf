{
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "~alsa_output.*",
          "elementary.eq.profile": null,
          "media.class": "Audio/Sink"
        }
      ],
      "actions": {
        "update-props": {
          "elementary.eq.profile": "generic-speakers-v1",
          "node.cache-params": false
        }
      }
    }
  ]
}
