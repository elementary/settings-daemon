{
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "~alsa_output.*",
          "elementary.eq.profile": null,
          "media.class": "Audio/Sink"
        }
      ],
      "actions": {
        "update-props": {
          "elementary.eq.profile": "generic-speakers-v1",
          "node.cache-params": false
        }
      }
    }
  ],
  "node.filter-graph.rules": [
    {
      "matches": [
        {
          "elementary.eq.profile": "generic-speakers-v1"
        }
      ],
      "actions": {
        "create-filter-graph": [
          {
            "nodes": [
              {
                "type": "builtin",
                "name": "eos_eq_1",
                "label": "bq_lowshelf",
                "control": {
                  "Freq": 200,
                  "Q": 0.707,
                  "Gain": 0
                }
              },
              {
                "type": "builtin",
                "name": "eos_eq_2",
                "label": "bq_peaking",
                "control": {
                  "Freq": 240,
                  "Q": 0.6,
                  "Gain": 0
                }
              },
              {
                "type": "builtin",
                "name": "eos_eq_3",
                "label": "bq_peaking",
                "control": {
                  "Freq": 1000,
                  "Q": 1,
                  "Gain": 0
                }
              },
              {
                "type": "builtin",
                "name": "eos_eq_4",
                "label": "bq_peaking",
                "control": {
                  "Freq": 16000,
                  "Q": 6.606,
                  "Gain": 0
                }
              },
              {
                "type": "builtin",
                "name": "eos_eq_5",
                "label": "bq_highshelf",
                "control": {
                  "Freq": 200,
                  "Q": 0.707,
                  "Gain": 0
                }
              },
              {
                "type": "builtin",
                "name": "eos_eq_h",
                "label": "linear",
                "control": {
                  "Mult": 1.0,
                  "Add": 0.0,
                  "Control": 0.0
                }
              }
            ],
            "links": [
              {
                "output": "eos_eq_1:Out",
                "input": "eos_eq_2:In"
              },
              {
                "output": "eos_eq_2:Out",
                "input": "eos_eq_3:In"
              },
              {
                "output": "eos_eq_3:Out",
                "input": "eos_eq_4:In"
              },
              {
                "output": "eos_eq_4:Out",
                "input": "eos_eq_5:In"
              },
              {
                "output": "eos_eq_5:Out",
                "input": "eos_eq_h:In"
              }
            ]
          }
        ]
      }
    }
  ]
}
